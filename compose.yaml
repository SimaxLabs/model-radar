name: model-radar

services:
  app:
    image: ${MODEL_RADAR_IMAGE:-model-radar:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "${MODEL_RADAR_BIND_ADDRESS:-127.0.0.1}:${MODEL_RADAR_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-16K}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/model-radar.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      ARTIFICIAL_ANALYSIS_API_KEY: ${ARTIFICIAL_ANALYSIS_API_KEY:-}
      CHEAP_MODEL_MAX_PRICE: ${CHEAP_MODEL_MAX_PRICE:-1}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - model-radar-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  model-radar-data:
    name: ${MODEL_RADAR_VOLUME:-model-radar-data}
